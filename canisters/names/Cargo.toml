[package]
name = "name_canister"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Keep these pinned to the versions ic-git uses (DESIGN.md section 9).
ic-cdk = "0.20"
candid = "0.10"
ic-stable-structures = "0.7"

# The allocation mechanisms (DESIGN.md section 5) and the cycles ledger
# client, shared with the other canisters. A path dependency while the
# crate settles; switch to a crates.io or git tag pin before a release,
# or the reproducible build (git archive, no sibling checkout) cannot see
# it.
ic-auction = { path = "../../../ic-auction", features = ["candid", "icrc"] }

# Certified resolution (DESIGN.md section 3): an in-heap hash tree over the
# name map whose root goes into certified data, so a query answer can carry
# a subnet-signed witness. serde_cbor encodes the witness the way agents
# expect (self-describing CBOR).
ic-certification = "4"
serde_cbor = "0.11"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
base64 = "0.22"
sha2 = "0.10"
