[package]
name = "names-verify"
version = "0.1.0"
edition = "2021"
description = "Independent verifier for ic-name-service certified resolution"

# Its own workspace: the root workspace builds only the canister, so the
# agent's large native dependency tree never touches the canister's
# Cargo.lock, Docker build context or module hash.
[workspace]

[dependencies]
ic-agent = "0.49"
ic-certification = "3"
candid = "0.10"
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
